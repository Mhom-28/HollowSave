
name: Build HollowSave

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Extract source
        run: unzip -o HollowSave_Fabric_1.20.1_source.zip

      - name: Build mod
        working-directory: HollowSave
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: hollowsave-jar
          path: HollowSave/build/libs/*.jar
          if-no-files-found: error
          
